name: release

on:
  push:
    tags: ['v[0-9]*']
  # Owner-run override of the live gate: the tag must already exist, and live-run.json must be
  # younger than 7 days with rows for all three bookmakers (scripts/check_live_run.py).
  #   gh workflow run release.yml --ref main -f tag=vX.Y.Z -F live-run-json=@live-run.json
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to release (vX.Y.Z); must exist. The live gate runs at the ref this
          dispatch is started from, so start it from a ref whose HEAD is the tag commit.
        required: true
        type: string
      live-run-json:
        description: 'Content of an owner-run live-run.json; when present the live job is skipped'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# One release at a time. A running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: NaijaBet_Api
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install the Chromium build for the offline browser test
        run: uv run playwright install --with-deps chromium
      - name: Test
        run: uv run pytest tests/ -q --timeout=120 -o log_cli=0

  # Required: every bookmaker returns rows from the Lagos egress (charter C6). Skipped only when
  # the owner dispatches with a live-run.json override, which check-override validates instead.
  live:
    if: ${{ github.event_name == 'push' || inputs.live-run-json == '' }}
    uses: ./.github/workflows/live.yml
    secrets:
      WINDSCRIBE_WG_CONF: ${{ secrets.WINDSCRIBE_WG_CONF }}

  check-override:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live-run-json != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate the owner-run live record
        env:
          LIVE_RUN_JSON: ${{ inputs.live-run-json }}
        run: printf '%s' "$LIVE_RUN_JSON" | python3 scripts/check_live_run.py - "$(git rev-parse HEAD)"

  # check-override is skipped on a tag push, so every job downstream of build needs
  # !cancelled() plus an explicit result test on each job it needs; the default
  # success() is false when any job in the needs chain was skipped.
  build:
    needs: [test, live, check-override]
    if: >-
      ${{ !cancelled()
          && needs.test.result == 'success'
          && (needs.live.result == 'success' || needs.check-override.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --group dev
      - name: Check that the tag matches the project version
        id: version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PROJECT_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match pyproject.toml version $PROJECT_VERSION."
            echo "Run 'make release-pr' to bump the version with git-cliff before tagging."
            exit 1
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build
        run: uv run python -m build && uv run twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Inert until the Trusted Publisher is registered on test.pypi.org.
  # Activate with: gh variable set SDLC_GATE_TEST_PYPI_PUBLISH --body true
  publish-test-pypi:
    needs: build
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && vars.SDLC_GATE_TEST_PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # publish-cmd equivalent: twine upload --repository testpypi dist/*
      - name: Publish to test.pypi.org
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-test-pypi:
    needs: [build, publish-test-pypi]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.publish-test-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      # Never combine test.pypi.org and pypi.org in one pip call: pip picks the highest version
      # across every index, and test.pypi.org hosts arbitrary names (dependency confusion).
      - name: Install the released version from test.pypi.org in a clean venv
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          MAX_WAIT=900
          ELAPSED=0
          python -m venv .smoke
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > deps.txt
          .smoke/bin/pip install --no-cache-dir --index-url https://pypi.org/simple/ -r deps.txt
          until .smoke/bin/pip install --no-cache-dir --no-deps \
                  --index-url https://test.pypi.org/simple/ \
                  "$PACKAGE==$VERSION"; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Install timed out after 15 minutes"
              exit 1
            fi
            sleep 60
            ELAPSED=$(( ELAPSED + 60 ))
          done
          .smoke/bin/pip check
          .smoke/bin/python -c "import NaijaBet_Api; print(NaijaBet_Api.__version__)"
          echo "Check passed"

  # Inert until the Trusted Publisher is registered on pypi.org.
  # Activate with: gh variable set SDLC_GATE_PYPI_PUBLISH --body true
  # The GitHub environment `pypi` holds the required-reviewer gate.
  # Requires both SDLC_GATE_TEST_PYPI_PUBLISH and SDLC_GATE_PYPI_PUBLISH to be on:
  # the test.pypi.org smoke test must actually succeed before a real PyPI publish.
  publish-pypi:
    needs: [build, verify-test-pypi]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.verify-test-pypi.result == 'success'
          && vars.SDLC_GATE_PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/NaijaBet-Api/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      # publish-cmd equivalent: twine upload dist/*
      - name: Publish to pypi.org
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: [build, publish-pypi]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Render the release notes from the changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PRERELEASE_FLAG=""
          case "$VERSION" in *rc*|*a*|*b*) PRERELEASE_FLAG="--prerelease" ;; esac
          gh release create "$RELEASE_TAG" dist/* \
            --title "$PACKAGE $VERSION" \
            --notes-file RELEASE_NOTES.md \
            $PRERELEASE_FLAG

  post-publish:
    needs: [build, publish-pypi, github-release]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.publish-pypi.result == 'success'
          && needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    # 5 min propagation wait + three 30 min polling checks, plus headroom.
    timeout-minutes: 100
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Wait for propagation
        run: sleep 300
      - name: Check registry-api
        run: |
          MAX_WAIT=$(( 30 * 60 ))
          ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            if curl -sf "https://pypi.org/pypi/NaijaBet-Api/$VERSION/json" | python -c "import sys,json; d=json.load(sys.stdin); assert d['info']['version']=='$VERSION'"; then
              echo "Check passed"
              exit 0
            fi
            sleep 60
            ELAPSED=$(( ELAPSED + 60 ))
          done
          echo "Check timed out after 30 minutes"
          exit 1
      - name: Check fresh-resolve
        run: |
          MAX_WAIT=$(( 30 * 60 ))
          ELAPSED=0
          python -m venv .smoke
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            if .smoke/bin/pip install --no-cache-dir "$PACKAGE==$VERSION" && .smoke/bin/python -c "import NaijaBet_Api"; then
              echo "Check passed"
              exit 0
            fi
            sleep 60
            ELAPSED=$(( ELAPSED + 60 ))
          done
          echo "Check timed out after 30 minutes"
          exit 1
      - name: Check github-release
        run: |
          MAX_WAIT=$(( 30 * 60 ))
          ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            if [ "$(gh release view "v$VERSION" --json assets --jq '.assets | length')" -ge 2 ]; then
              echo "Check passed"
              exit 0
            fi
            sleep 60
            ELAPSED=$(( ELAPSED + 60 ))
          done
          echo "Check timed out after 30 minutes"
          exit 1
