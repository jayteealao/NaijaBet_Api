name: live

# Runs the live suite against the three bookmakers from a Nigerian egress. The tunnel comes from
# the repository secret WINDSCRIBE_WG_CONF (a Windscribe WireGuard config for Lagos). The release
# workflow calls this workflow; the owner can also dispatch it, and it runs weekly to catch drift.

on:
  workflow_call:
    secrets:
      WINDSCRIBE_WG_CONF:
        required: true
  workflow_dispatch:
  # A change to the gate proves itself on the branch that carries it; workflow_dispatch resolves
  # only a file that exists on the default branch.
  push:
    paths:
      - .github/workflows/live.yml
      - tests/e2e/**
      - tests/conftest.py
      - scripts/egress.py
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install the Chromium build for the Playwright tests
        run: uv run playwright install --with-deps chromium
      # The exported config can carry a DNS line (needs resolvconf, absent on the runner image) and
      # an IPv6 route (the runner has none); both are stripped. The secret never reaches the log.
      - name: Bring up the tunnel
        env:
          WG_CONF: ${{ secrets.WINDSCRIBE_WG_CONF }}
        run: |
          if [ -z "$WG_CONF" ]; then
            echo "WINDSCRIBE_WG_CONF is empty; create the secret from a Windscribe Lagos WireGuard config."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          printf '%s\n' "$WG_CONF" | sed -e '/^DNS *=/d' -e 's/, *::\/0//' | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
      # Akamai answers curl's own User-Agent with 403 from every egress, and the bare root
      # redirects to sports.bet9ja.com; the probe therefore asks the sports host as a browser.
      - name: Prove the egress
        env:
          UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
        run: |
          COUNTRY="$(curl -sS --max-time 30 https://ipinfo.io/country | tr -d '[:space:]')"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -A "$UA" https://sports.bet9ja.com/)"
          echo "egress country=$COUNTRY bet9ja=$CODE"
          [ "$COUNTRY" = NG ] && [ "$CODE" = 200 ]
      - name: Live suite
        run: make live
      # live-run.json embeds the tunnel's exit IP (egress.ip); the repo is public, so run
      # artifacts are downloadable by any authenticated GitHub user. Upload a redacted copy
      # instead and leave the original untouched for the local release-override check.
      - name: Redact the egress IP for upload
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("live-run.json")
          if path.exists():
              record = json.loads(path.read_text(encoding="utf-8"))
              egress = record.get("egress")
              if isinstance(egress, dict) and "ip" in egress:
                  egress["ip"] = "redacted"
              Path("live-run.redacted.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-run
          path: live-run.redacted.json
          if-no-files-found: ignore
      - name: Tear down the tunnel
        if: always()
        run: sudo wg-quick down wg0 || true
