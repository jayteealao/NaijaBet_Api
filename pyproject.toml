[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"
# Added by the release-pipeline build — plan v1, 2026-09-13
[project]
name = "NaijaBet_Api"
version = "0.3.0"
description = "A wrapper around the API of Nigeria's major betting sites"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "graphitenerd", email = "jayteealao@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.14",
    "arrow>=1.4",
    "jmespath>=1.1",
    "requests>=2.34",
]

[project.optional-dependencies]
playwright = ["playwright"]

[project.urls]
Homepage = "https://github.com/jayteealao/NaijaBet_Api"
"Bug Tracker" = "https://github.com/jayteealao/NaijaBet_Api/issues"
Changelog = "https://github.com/jayteealao/NaijaBet_Api/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "build>=1.6",
    "pip-audit>=2.10",
    "pre-commit>=4.6",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.1",
    "ruff>=0.16",
    "twine>=7.0",
    "ty>=0.0.80",
]

[tool.setuptools]
packages = ["NaijaBet_Api", "NaijaBet_Api.bookmakers", "NaijaBet_Api.utils"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
addopts = "--color=yes -ra"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = ["*/__main__.py", "*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
